# Build p4rth-opencode + opencode-speech for every JetBrains target platform,
# package managed-runtime ZIPs + manifest, and publish a GitHub Release.
#
# Trigger: Actions → "JetBrains runtime release" → Run workflow
# Inputs: version (required), create_release (default true)
#
# Uses free GitHub-hosted runners only (no Blacksmith / paid runners).
# Optional Apple/Windows code signing runs only when the matching secrets exist.

name: JetBrains runtime release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 2.0.1). Tag will be v<version>."
        required: true
        type: string
      # Independent of "Use workflow from". Default branch (dev) holds the YAML so the
      # Run workflow button appears; product + packages/speech live on jetbrains.
      build_ref:
        description: "Git branch/tag/SHA to build (must include packages/speech)"
        required: true
        type: string
        default: jetbrains
      create_release:
        description: "Create/update the GitHub Release and upload assets"
        required: false
        type: boolean
        default: true
      draft:
        description: "Create the release as a draft"
        required: false
        type: boolean
        default: false

concurrency:
  group: jetbrains-runtime-release-${{ inputs.version }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-speech:
    name: speech (${{ matrix.settings.output }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            output: linux-x64
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            output: linux-arm64
          - host: macos-15
            target: aarch64-apple-darwin
            output: darwin-arm64
          - host: macos-15-intel
            target: x86_64-apple-darwin
            output: darwin-x64
          - host: windows-2025
            target: x86_64-pc-windows-msvc
            output: windows-x64
          # windows-arm64 omitted: whisper.cpp ggml rejects MSVC on ARM and clang-cl
          # CMake still fails on GHA windows-11-arm. Revisit when upstream supports it.
    runs-on: ${{ matrix.settings.host }}
    # Map secrets → env once so step `if:` can use env (secrets context is not allowed in step if).
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref }}

      - name: Require packages/speech
        shell: bash
        run: |
          if [[ ! -d packages/speech ]]; then
            echo "::error::packages/speech is missing on ref '${{ inputs.build_ref }}'."
            echo "Set build_ref=jetbrains (default). Do not build plain 'dev'."
            ls -la packages || true
            exit 1
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build libclang-dev

      - name: Setup MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          # whisper/miniaudio C builds need INCLUDE/LIB/PATH from Visual Studio.
          arch: x64

      # choco install llvm is flaky on GHA (extension upgrade failures). Use the action.
      - name: Install Windows LLVM (libclang for bindgen)
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1.8"

      # Critical: Git for Windows ships usr\bin\link.exe (GNU coreutils), which rustc
      # picks up instead of MSVC link.exe → "/usr/bin/link: extra operand".
      - name: Prefer MSVC link.exe over Git usr/bin link
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parts = $env:PATH -split ';' | Where-Object {
            $_ -and ($_ -notmatch '(?i)[\\/]Git[\\/]usr[\\/]bin')
          }
          $env:PATH = ($parts -join ';')
          $msvcLink = (Get-Command link.exe -ErrorAction Stop).Source
          Write-Host "link.exe resolves to: $msvcLink"
          if ($msvcLink -match '(?i)Git[\\/]usr[\\/]bin') {
            throw "MSVC link.exe not found on PATH (still seeing Git usr/bin link): $msvcLink"
          }
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($env:LLVM_PATH) {
            $libclang = Join-Path $env:LLVM_PATH "bin"
            "LIBCLANG_PATH=$libclang" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build speech sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: packages/speech
        env:
          GGML_NATIVE: "OFF"
          GGML_OPENMP: "OFF"
        run: |
          $ErrorActionPreference = "Stop"
          # Drop Git usr/bin so rustc never sees GNU link.exe
          $env:PATH = (($env:PATH -split ";" | Where-Object { $_ -and ($_ -notmatch "(?i)[\\/]Git[\\/]usr[\\/]bin") }) -join ";")
          Write-Host "link.exe => $((Get-Command link.exe).Source)"
          if (((Get-Command link.exe).Source) -match "(?i)Git[\\/]usr[\\/]bin") {
            throw "Still using Git usr/bin link.exe"
          }
          # Bundled whisper bindings are Linux-only; generate on Windows
          Remove-Item Env:WHISPER_DONT_GENERATE_BINDINGS -ErrorAction SilentlyContinue
          $env:CMAKE_MSVC_RUNTIME_LIBRARY = "MultiThreaded"
          $env:RUSTFLAGS = "$($env:RUSTFLAGS) -C target-feature=+crt-static".Trim()
          cargo build --release --locked --target ${{ matrix.settings.target }}

      - name: Build speech sidecar (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: packages/speech
        env:
          GGML_NATIVE: "OFF"
          GGML_OPENMP: "OFF"
          WHISPER_DONT_GENERATE_BINDINGS: "1"
        run: |
          set -euo pipefail
          if [[ "${{ matrix.settings.output }}" == "linux-arm64" || "${{ matrix.settings.output }}" == "darwin-arm64" ]]; then
            export GGML_CPU_ARM_ARCH=armv8-a
          fi
          cargo build --release --locked --target ${{ matrix.settings.target }}

      - name: Sign macOS speech sidecar
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        shell: bash
        run: |
          identity=$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ {print $2; exit}')
          test -n "$identity"
          codesign --force --options runtime --timestamp --sign "$identity" \
            "packages/speech/target/${{ matrix.settings.target }}/release/opencode-speech"
          codesign --verify --strict --verbose=2 \
            "packages/speech/target/${{ matrix.settings.target }}/release/opencode-speech"

      - name: Stage speech sidecar
        shell: bash
        run: |
          mkdir -p "packages/speech/dist/${{ matrix.settings.output }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "packages/speech/target/${{ matrix.settings.target }}/release/opencode-speech.exe" \
              "packages/speech/dist/${{ matrix.settings.output }}/opencode-speech.exe"
          else
            cp "packages/speech/target/${{ matrix.settings.target }}/release/opencode-speech" \
              "packages/speech/dist/${{ matrix.settings.output }}/opencode-speech"
            chmod 755 "packages/speech/dist/${{ matrix.settings.output }}/opencode-speech"
          fi

      # Upload the platform directory itself so merge-multiple keeps
      # speech-dist/<platform>/opencode-speech (not a flat overwrite of one binary).
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-speech-${{ matrix.settings.output }}
          path: packages/speech/dist
          if-no-files-found: error

  build-cli:
    name: build CLI + package runtimes
    needs: build-speech
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref }}

      - name: Require packages/speech
        run: test -d packages/speech

      - uses: ./.github/actions/setup-bun

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download speech sidecars
        uses: actions/download-artifact@v4
        with:
          pattern: opencode-speech-*
          path: packages/opencode/speech-dist
          merge-multiple: true

      - name: Verify speech layout
        run: |
          set -euo pipefail
          echo "Downloaded tree:"
          find packages/opencode/speech-dist -type f | sort || true
          for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            f="packages/opencode/speech-dist/$p/opencode-speech"
            if [[ ! -f "$f" ]]; then
              echo "::error::Missing $f"
              exit 1
            fi
            # Artifact download may drop the executable bit on Linux runners.
            chmod +x "$f"
            test -x "$f"
          done
          win="packages/opencode/speech-dist/windows-x64/opencode-speech.exe"
          if [[ ! -f "$win" ]]; then
            echo "::error::Missing $win"
            exit 1
          fi
          find packages/opencode/speech-dist -type f | sort

      - name: Build JetBrains platform CLI binaries (with speech)
        env:
          OPENCODE_VERSION: ${{ inputs.version }}
          OPENCODE_SPEECH_DIR: ${{ github.workspace }}/packages/opencode/speech-dist
        run: |
          # Five supported plugin platforms (windows-arm64 not yet buildable with whisper.cpp).
          ./packages/opencode/script/build.ts \
            --only=linux-x64,linux-arm64,darwin-x64,darwin-arm64,windows-x64

      - name: Verify JetBrains runtime targets include speech
        run: |
          set -euo pipefail
          for target in opencode-linux-x64 opencode-linux-arm64 opencode-darwin-x64 opencode-darwin-arm64; do
            test -f "packages/opencode/dist/$target/bin/opencode"
            test -x "packages/opencode/dist/$target/bin/opencode-speech"
          done
          test -f "packages/opencode/dist/opencode-windows-x64/bin/opencode.exe"
          test -f "packages/opencode/dist/opencode-windows-x64/bin/opencode-speech.exe"

      - name: Package standalone CLI archives
        working-directory: packages/opencode
        run: bun run package:release

      - name: Package JetBrains managed runtimes + manifest
        working-directory: sdks/jetbrains
        run: |
          # Package each built platform; regenerates the full manifest from present ZIPs.
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            ./gradlew --no-daemon packageRuntimeRelease \
              -PreleaseVersion=${{ inputs.version }} \
              -PreleaseRepo=${{ github.repository }} \
              -PreleasePlatform="$platform"
          done

      - name: Inspect release tree
        run: |
          set -euo pipefail
          ls -la "sdks/jetbrains/build/release/${{ inputs.version }}"
          for z in sdks/jetbrains/build/release/${{ inputs.version }}/p4rth-opencode-*.zip; do
            echo "=== $z ==="
            unzip -l "$z" | head -20
          done
          cat "sdks/jetbrains/build/release/${{ inputs.version }}/p4rth-opencode-jetbrains-runtime.json"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-runtime-${{ inputs.version }}
          path: |
            sdks/jetbrains/build/release/${{ inputs.version }}/
            packages/opencode/dist/*.tar.gz
            packages/opencode/dist/*.zip
          if-no-files-found: error

  publish-release:
    name: publish GitHub Release
    needs: build-cli
    if: inputs.create_release
    runs-on: ubuntu-24.04
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          name: jetbrains-runtime-${{ inputs.version }}
          path: release-assets

      - name: Flatten asset paths
        run: |
          set -euo pipefail
          mkdir -p upload
          # JetBrains ZIPs + manifest
          find release-assets -type f \( -name 'p4rth-opencode-*.zip' -o -name 'p4rth-opencode-jetbrains-runtime.json' \) -exec cp -v {} upload/ \;
          # Standalone CLI archives (optional user downloads)
          find release-assets -type f \( -name 'opencode-linux-*.tar.gz' -o -name 'opencode-darwin-*.zip' -o -name 'opencode-windows-*.zip' \) -exec cp -v {} upload/ \;
          ls -lah upload

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: P4rth OpenCode ${{ inputs.version }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          body: |
            ## JetBrains managed runtime ${{ inputs.version }}

            This release ships **`p4rth-opencode` + `opencode-speech`** for every plugin platform so local voice dictation works.

            ### Plugin install source
            ```
            https://github.com/${{ github.repository }}/releases/latest/download/p4rth-opencode-jetbrains-runtime.json
            ```

            ### Platforms
            - `p4rth-opencode-linux-x64.zip`
            - `p4rth-opencode-linux-arm64.zip`
            - `p4rth-opencode-darwin-x64.zip`
            - `p4rth-opencode-darwin-arm64.zip`
            - `p4rth-opencode-windows-x64.zip`
            - `p4rth-opencode-windows-arm64.zip`

            Each ZIP root contains `p4rth-opencode` (or `.exe`) **and** `opencode-speech` (or `.exe`).

            After updating, clear a stale managed install if the plugin keeps the old binary:
            ```
            # Linux / macOS example
            rm -rf ~/.cache/JetBrains/*/p4rth-opencode
            ```
            Then reopen the OpenCode tool window so the plugin re-downloads from this release.
          files: upload/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
