[package]
name = "opencode-speech"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
hound = "3.5.1"
# bindgen is required on aarch64 (and Windows) because om-fork-ep-miniaudio-sys only
# ships pre-generated FFI bindings for a subset of targets (e.g. linux-x86_64).
# default-features is false so we do not pull ma-debug / vorbis extras; re-enable bindgen explicitly.
miniaudio = { package = "om-fork-miniaudio", version = "0.12.2", default-features = false, features = ["bindgen", "ma-log-level-error", "ma-no-flac", "ma-no-mp3"] }
whisper-rs = "0.16.0"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
